<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Customer Churn Prediction</h2>
        <form id="predictionForm" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Senior Citizen</label>
                <select class="form-select" id="SeniorCitizen" required>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Partner</label>
                <select class="form-select" id="Partner" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Dependents</label>
                <select class="form-select" id="Dependents" required>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Tenure (months)</label>
                <input type="number" class="form-control" id="tenure" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Service</label>
                <select class="form-select" id="PhoneService" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Multiple Lines</label>
                <select class="form-select" id="MultipleLines" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Internet Service</label>
                <select class="form-select" id="InternetService" required>
                    <option value="0">No</option>
                    <option value="1">DSL</option>
                    <option value="2">Fiber optic</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Online Security</label>
                <select class="form-select" id="OnlineSecurity" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Online Backup</label>
                <select class="form-select" id="OnlineBackup" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Device Protection</label>
                <select class="form-select" id="DeviceProtection" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Tech Support</label>
                <select class="form-select" id="TechSupport" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Streaming TV</label>
                <select class="form-select" id="StreamingTV" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Streaming Movies</label>
                <select class="form-select" id="StreamingMovies" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Contract</label>
                <select class="form-select" id="Contract" required>
                    <option value="0">Month-to-month</option>
                    <option value="1">One year</option>
                    <option value="2">Two year</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Paperless Billing</label>
                <select class="form-select" id="PaperlessBilling" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment Method</label>
                <select class="form-select" id="PaymentMethod" required>
                    <option value="0">Electronic check</option>
                    <option value="1">Mailed check</option>
                    <option value="2">Bank transfer</option>
                    <option value="3">Credit card</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Monthly Charges</label>
                <input type="number" step="0.01" class="form-control" id="MonthlyCharges" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Total Charges</label>
                <input type="number" step="0.01" class="form-control" id="TotalCharges" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Predict Churn</button>
            </div>
        </form>

        <div id="result" class="prediction-result alert">
            <h4>Prediction Results:</h4>
            <p>Churn Prediction: <span id="churnPrediction"></span></p>
            <p>Churn Probability: <span id="churnProbability"></span></p>
            <p>No Churn Probability: <span id="noChurnProbability"></span></p>
            
            <div class="mt-4">
                <h5>AI Analysis</h5>
                <div id="aiAnalysis" class="card">
                    <div class="card-body">
                        <pre id="aiAnalysisText" style="white-space: pre-wrap;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                gender: parseInt(document.getElementById('gender').value),
                SeniorCitizen: parseInt(document.getElementById('SeniorCitizen').value),
                Partner: parseInt(document.getElementById('Partner').value),
                Dependents: parseInt(document.getElementById('Dependents').value),
                tenure: parseInt(document.getElementById('tenure').value),
                PhoneService: parseInt(document.getElementById('PhoneService').value),
                MultipleLines: parseInt(document.getElementById('MultipleLines').value),
                InternetService: parseInt(document.getElementById('InternetService').value),
                OnlineSecurity: parseInt(document.getElementById('OnlineSecurity').value),
                OnlineBackup: parseInt(document.getElementById('OnlineBackup').value),
                DeviceProtection: parseInt(document.getElementById('DeviceProtection').value),
                TechSupport: parseInt(document.getElementById('TechSupport').value),
                StreamingTV: parseInt(document.getElementById('StreamingTV').value),
                StreamingMovies: parseInt(document.getElementById('StreamingMovies').value),
                Contract: parseInt(document.getElementById('Contract').value),
                PaperlessBilling: parseInt(document.getElementById('PaperlessBilling').value),
                PaymentMethod: parseInt(document.getElementById('PaymentMethod').value),
                MonthlyCharges: parseFloat(document.getElementById('MonthlyCharges').value),
                TotalCharges: parseFloat(document.getElementById('TotalCharges').value)
            };

            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                document.getElementById('churnPrediction').textContent = data.churn_prediction;
                document.getElementById('churnProbability').textContent = (data.churn_probability * 100).toFixed(2) + '%';
                document.getElementById('noChurnProbability').textContent = (data.no_churn_probability * 100).toFixed(2) + '%';
                document.getElementById('aiAnalysisText').textContent = data.ai_analysis;
                
                resultDiv.style.display = 'block';
                resultDiv.className = 'prediction-result alert ' + 
                    (data.churn_prediction === 'Yes' ? 'alert-danger' : 'alert-success');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error making prediction. Please try again.');
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
